version: "3.8"

services:
  # PostgreSQL Database Service
  mindfuel-db:
    image: postgres:15-alpine
    container_name: mindfuel-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - mindfuel-network

  # Python Application Service
  mindfuel-quotes:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: mindfuel-quotes
    restart: "no"

    env_file:
      - .env.docker

    depends_on:
      mindfuel-db:
        condition: service_healthy

    volumes:
      - ./logs:/app/logs

    networks:
      - mindfuel-network


# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local


# Custom network for service communication
networks:
  mindfuel-network:
    driver: bridge